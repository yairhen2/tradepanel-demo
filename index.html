<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradePanel — Multi-Strategy Trading Scanner Demo</title>
<meta name="description" content="TradePanel public portfolio demo: deterministic day, swing and long-term strategy scanning with simulated data.">
<link rel="stylesheet" href="scanner-upgrade.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#08080a;--s1:#101014;--s2:#16161c;--s3:#1e1e26;--brd:#24242e;--brd2:#32323e;
  --t1:#f4f4f7;--t2:#9a9aab;--t3:#5c5c6b;
  --up:#00e08a;--upbg:#00e08a12;--dn:#ff4d5e;--dnbg:#ff4d5e12;
  --blu:#4d8dff;--blubg:#4d8dff12;--pur:#a855f7;--purbg:#a855f712;
  --amb:#fbbf24;--ambbg:#fbbf2412;--vw:#f5c518;--sb:238px;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:5px}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--s1);border-right:1px solid var(--brd);display:flex;flex-direction:column;z-index:100}
.logo{padding:20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:11px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--up),var(--blu));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#05050a;box-shadow:0 0 22px #00e08a30}
.logo-txt{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:9px;color:var(--t3);letter-spacing:.13em;font-weight:600;margin-top:1px}
.nav{flex:1;padding:14px 11px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:.15s;margin-bottom:3px;position:relative}
.nav-item:hover{background:var(--s2);color:var(--t1)}
.nav-item.on{background:var(--s3);color:var(--t1);font-weight:600}
.nav-item.on::before{content:'';position:absolute;left:-11px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--up);border-radius:0 3px 3px 0}
.nav-ico{width:16px;text-align:center;flex-shrink:0;opacity:.85}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:var(--upbg);color:var(--up)}
.demo-tag{margin:0 11px 10px;padding:9px 10px;border-radius:8px;background:var(--ambbg);border:1px solid #fbbf2426;font-size:9.4px;color:var(--amb);line-height:1.5;font-weight:500}
.sb-foot{padding:12px;border-top:1px solid var(--brd)}
.acct{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.avatar{width:31px;height:31px;border-radius:50%;background:linear-gradient(135deg,var(--pur),var(--blu));display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.acct-n{font-size:12.3px;font-weight:600}.acct-p{font-size:9.8px;color:var(--t3)}
/* MAIN */
.main{margin-left:var(--sb);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:#08080ae8;backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pg-t{font-size:18px;font-weight:700;letter-spacing:-.4px}
.pg-s{font-size:11.8px;color:var(--t3);margin-top:2px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bias-pill{display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:20px;font-size:11.4px;font-weight:700;letter-spacing:.04em}
.bias-pill.bull{background:var(--upbg);border:1px solid #00e08a30;color:var(--up)}
.bias-pill.bear{background:var(--dnbg);border:1px solid #ff4d5e30;color:var(--dn)}
.bias-pill.neut{background:var(--ambbg);border:1px solid #fbbf2430;color:var(--amb)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blip 2s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.45}}
.clock{font-size:11.5px;color:var(--t2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:12.2px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--s2);border:1px solid var(--brd2);color:var(--t2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.pri{background:var(--up);border-color:var(--up);color:#05050a}
.btn.pri:hover{opacity:.87;color:#05050a}
.btn.act{background:var(--blubg);border-color:#4d8dff55;color:var(--blu)}
.btn.dgr{border-color:#ff4d5e40;color:var(--dn)}.btn.dgr:hover{background:var(--dnbg)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.content{padding:22px 26px 56px;max-width:1560px}
/* ANIM */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalRise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-560px 0}100%{background-position:560px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.anim{animation:rise .4s cubic-bezier(.16,1,.3,1) both}
.sk{background:linear-gradient(90deg,var(--s2) 8%,var(--s3) 18%,var(--s2) 33%);background-size:900px 100%;animation:shimmer 1.2s linear infinite;border-radius:8px}
.spinner{width:13px;height:13px;border:2px solid #05050a44;border-top-color:#05050a;border-radius:50%;animation:spin .6s linear infinite}
/* CARDS */
.card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px;flex-wrap:wrap}
.card-t{font-size:13.2px;font-weight:700;letter-spacing:-.15px}
.card-x{font-size:11.2px;color:var(--t3);margin-top:2px;font-weight:400}
.grid{display:grid;gap:13px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.kpi{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.75}
.kpi.up::after{background:var(--up)}.kpi.dn::after{background:var(--dn)}
.kpi.bl::after{background:var(--blu)}.kpi.pu::after{background:var(--pur)}
.kpi.am::after{background:var(--amb)}
.kpi-l{font-size:9.8px;font-weight:700;color:var(--t3);letter-spacing:.1em;margin-bottom:8px}
.kpi-v{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi-f{margin-top:8px;font-size:11px;font-weight:600}
.pos{color:var(--up)}.neg{color:var(--dn)}.mut{color:var(--t3)}
.tag{font-size:9.4px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;display:inline-block}
.t-up{background:var(--upbg);color:var(--up)}.t-dn{background:var(--dnbg);color:var(--dn)}
.t-bl{background:var(--blubg);color:var(--blu)}.t-pu{background:var(--purbg);color:var(--pur)}
.t-am{background:var(--ambbg);color:var(--amb)}.t-mut{background:var(--s3);color:var(--t3)}
.tbl{width:100%;border-collapse:collapse;font-size:12.4px}
.tbl th{text-align:left;padding:9px 11px;font-size:9.4px;font-weight:700;color:var(--t3);letter-spacing:.11em;border-bottom:1px solid var(--brd);white-space:nowrap}
.tbl td{padding:11px}
.tbl tbody tr{border-bottom:1px solid var(--brd);transition:background .13s}
.tbl tbody tr:last-child{border-bottom:none}
.tbl tbody tr:hover{background:var(--s2)}
.tr{text-align:right}.tc{text-align:center}
.tk-link{font-weight:700;cursor:pointer;transition:.15s;background:none;border:0;color:inherit;font-family:inherit;font-size:inherit;padding:0;text-align:left}
.tk-link:hover{color:var(--blu);text-shadow:0 0 16px #4d8dff55}
.prog{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.sec-t{font-size:13px;font-weight:700;margin:22px 0 11px;letter-spacing:-.2px}
.empty{padding:50px 20px;text-align:center;color:var(--t3)}
.empty-i{font-size:32px;margin-bottom:12px;opacity:.4}
.empty-t{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:5px}
.empty-d{font-size:12px;line-height:1.6}
canvas{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--brd);gap:18px}
.set-row:last-child{border-bottom:none}
.set-n{font-size:12.8px;font-weight:600;margin-bottom:3px}
.set-d{font-size:11.2px;color:var(--t3);line-height:1.5}
.tog{width:42px;height:24px;border-radius:13px;background:var(--s3);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;border:1px solid var(--brd2)}
.tog.on{background:var(--up);border-color:var(--up)}
.tog::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--t1);transition:transform .2s cubic-bezier(.16,1,.3,1)}
.tog.on::after{transform:translateX(18px);background:#05050a}
.sld{-webkit-appearance:none;width:150px;height:5px;border-radius:3px;background:var(--s3);outline:none;flex-shrink:0}
.sld::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--up);cursor:pointer;box-shadow:0 0 9px #00e08a55}
.sel,.inp{background:var(--s2);border:1px solid var(--brd2);color:var(--t1);border-radius:8px;padding:8px 11px;font-size:12.2px;font-family:inherit;outline:none}
.sel{cursor:pointer}.inp{width:100%}.sel:focus,.inp:focus{border-color:var(--blu)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.6px;font-weight:600;color:var(--t3);letter-spacing:.06em;margin-bottom:6px}
.search{position:relative;flex:1;min-width:170px;max-width:290px}
.search input{width:100%;background:var(--s2);border:1px solid var(--brd2);color:var(--t1);border-radius:9px;padding:8px 12px 8px 31px;font-size:12.2px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--blu)}
.search::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:15px}
/* ══ SCANNER ══ */
.bias-board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd);border-radius:11px;overflow:hidden}
.bias-cell{background:var(--s2);padding:13px}
.bias-tk{font-size:12.6px;font-weight:700;margin-bottom:5px}
.bias-vote{font-size:16px;font-weight:800;letter-spacing:-.4px}
.bias-sub{font-size:10px;color:var(--t3);margin-top:3px}
.filter-list{background:var(--s2);border-radius:10px;padding:3px 13px}
.frow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--brd);font-size:11.8px;line-height:1.5}
.frow:last-child{border-bottom:none}
.fnum{width:19px;height:19px;border-radius:6px;background:var(--s3);color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:9.4px;font-weight:700;flex-shrink:0}
.fnum.hard{background:var(--upbg);color:var(--up)}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(368px,1fr));gap:13px}
.opp{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:16px;transition:.18s;position:relative}
.opp:hover{border-color:var(--brd2);transform:translateY(-2px)}
.opp.rej{opacity:.6}
.opp-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px}
.opp-tk{font-size:18px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.opp-nm{font-size:10.6px;color:var(--t3);margin-top:2px}
.opp-px{font-size:15px;font-weight:700;text-align:right}
.opp-ch{font-size:11px;font-weight:600;margin-top:2px;text-align:right}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd);border-radius:9px;overflow:hidden;margin-bottom:11px}
.lvl{background:var(--s2);padding:9px}
.lvl-l{font-size:8.8px;font-weight:700;color:var(--t3);letter-spacing:.08em;margin-bottom:3px}
.lvl-v{font-size:12.8px;font-weight:700}
.opp-m{display:flex;align-items:center;justify-content:space-between;gap:11px;padding-top:11px;border-top:1px solid var(--brd)}
.conf{flex:1}
.conf-h{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px}
.conf-bar{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.opp-rr{text-align:right;flex-shrink:0}
.opp-rr-v{font-size:15px;font-weight:800}
.opp-rr-l{font-size:8.8px;color:var(--t3);font-weight:700;letter-spacing:.08em}
.opp-f{display:flex;gap:11px;margin-top:10px;font-size:10.3px;color:var(--t3);flex-wrap:wrap}
.opp-f b{color:var(--t2);font-weight:600}
.opp-sqz{display:flex;align-items:flex-end;gap:2px;height:26px;margin-bottom:11px;padding:5px 8px;background:var(--s2);border-radius:8px}
.sqzb{flex:1;border-radius:2px;min-height:2px}
.rej-box{padding:10px;border-radius:9px;background:var(--dnbg);border:1px solid #ff4d5e20}
.rej-t{font-size:10.2px;font-weight:700;color:var(--dn);margin-bottom:5px}
.rej-i{font-size:10.5px;color:var(--t2);line-height:1.65}
.opp-cta{position:absolute;right:16px;bottom:13px;font-size:10px;color:var(--blu);opacity:0;transition:.18s;font-weight:600}
.opp:hover .opp-cta{opacity:1}
.scan-prog-h{display:flex;justify-content:space-between;font-size:12.2px;margin-bottom:8px;color:var(--t2)}
.res-bar{display:flex;align-items:center;gap:17px;flex-wrap:wrap}
.res-stat{display:flex;flex-direction:column}
.res-stat b{font-size:18px;font-weight:800;letter-spacing:-.5px}
.res-stat span{font-size:10.2px;color:var(--t3);margin-top:1px}
.res-div{width:1px;height:26px;background:var(--brd)}
/* ══ MODAL / CHART ══ */
.ov{position:fixed;inset:0;z-index:1000;background:#030306c9;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease both}
.mp{width:min(1400px,100%);max-height:94vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--brd2);border-radius:17px;box-shadow:0 30px 90px #000b;animation:modalRise .28s cubic-bezier(.16,1,.3,1) both}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:1px solid var(--brd)}
.m-sym{font-size:22px;font-weight:800;letter-spacing:-.7px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.m-co{font-size:11.2px;color:var(--t3);margin-top:3px}
.m-px{text-align:right}
.m-px b{font-size:22px;font-weight:800;letter-spacing:-.7px;display:block}
.mx{width:33px;height:33px;border-radius:9px;border:1px solid var(--brd);background:var(--s2);color:var(--t2);cursor:pointer;font-size:18px;flex-shrink:0;transition:.16s}
.mx:hover{border-color:var(--dn);color:var(--dn);background:var(--dnbg)}
.mb{padding:16px 20px;overflow:auto}
.mlay{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.72fr);gap:14px}
@media(max-width:1100px){.mlay{grid-template-columns:1fr}}
.ctool{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:10px;flex-wrap:wrap}
.tf-grp{display:flex;gap:4px;flex-wrap:wrap}
.tf{background:var(--s2);border:1px solid var(--brd);color:var(--t3);border-radius:7px;padding:6px 11px;font-size:11.2px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s}
.tf:hover{color:var(--t1)}.tf.on{background:var(--blu);border-color:var(--blu);color:#fff}
.cleg{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:10.2px;color:var(--t3)}
.li{display:flex;align-items:center;gap:5px}
.ll{width:14px;height:2px;border-radius:2px}
.readout{font-size:10.6px;color:var(--t2);min-height:15px;margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.readout b{color:var(--t1);font-weight:600;margin-right:7px}
.cwrap{position:relative;background:#0b0b0f;border:1px solid var(--brd);border-radius:11px;overflow:hidden}
.cwrap canvas{width:100%;cursor:crosshair;touch-action:none}
.ctip{position:absolute;display:none;pointer-events:none;padding:6px 8px;border-radius:7px;background:#121219e8;border:1px solid var(--brd2);font-size:10px;color:var(--t2);box-shadow:0 8px 28px #0007;font-family:'JetBrains Mono',monospace}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}
@media(max-width:760px){.lgrid{grid-template-columns:repeat(2,1fr)}}
.lcard{padding:11px;background:var(--s2);border:1px solid var(--brd);border-radius:10px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:7px}
.lname{font-size:8.8px;color:var(--t3);font-weight:700;letter-spacing:.09em}
.ledit{border:0;background:transparent;color:var(--t3);cursor:pointer;font-size:10.6px;font-family:inherit}
.ledit:hover{color:var(--blu)}
.lprice{font-size:14px;font-weight:700;margin-top:5px}
.mside{display:flex;flex-direction:column;gap:13px}
.mcard{background:var(--s1);border:1px solid var(--brd);border-radius:13px;padding:15px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--brd);border-radius:10px;overflow:hidden}
.met{background:var(--s2);padding:10px}
.met-l{font-size:8.6px;color:var(--t3);font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.met-v{font-size:12px;font-weight:600}
.chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:11.3px;color:var(--t2);line-height:1.5;border-bottom:1px solid var(--brd)}
.chk:last-child{border-bottom:none}
.chk-i{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;flex-shrink:0;margin-top:1px;font-weight:700}
.chk-i.ok{background:var(--upbg);color:var(--up)}
.chk-i.no{background:var(--dnbg);color:var(--dn)}
.chk-i.soft{background:var(--s3);color:var(--t3)}
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.agrid .btn{justify-content:center}
.note{padding:9px 10px;border-radius:9px;background:var(--ambbg);border:1px solid #fbbf2428;color:var(--amb);font-size:10.3px;line-height:1.45}
.verdict{padding:13px;border-radius:11px;margin-bottom:13px}
.verdict.ok{background:var(--upbg);border:1px solid #00e08a35}
.verdict.no{background:var(--dnbg);border:1px solid #ff4d5e35}
.v-t{font-size:15px;font-weight:800;letter-spacing:.02em}
.v-s{font-size:11.2px;color:var(--t2);margin-top:4px;line-height:1.5}
/* ══ HEALTH ══ */
.svc{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--brd)}
.svc:last-child{border-bottom:none}
.svc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.svc-dot.up{background:var(--up);box-shadow:0 0 8px #00e08a70}
.svc-dot.warn{background:var(--amb);box-shadow:0 0 8px #fbbf2470}

const $=id=>document.getElementById(id);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mkRnd(seed){let s=seed>>>0||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

/* ── MARKET BIAS: proxy-stock vote (AAPL / MSFT / NVDA) ── */
const PROXIES=[{tk:'AAPL',vote:'BULL',chg:1.24},{tk:'MSFT',vote:'BULL',chg:0.86},{tk:'NVDA',vote:'BULL',chg:2.41}];
const MARKET_BIAS=(()=>{const b=PROXIES.filter(p=>p.vote==='BULL').length,r=PROXIES.length-b;
 return b>=2?'Bull':r>=2?'Bear':'Neutral'})();

/* ── STRATEGY v1.0 — the single approved strategy ── */
const HARD_LONG=['Market bias is Bull','Market structure is HH / HL (Sideways = no trade)',
 'Price above VWAP','Price above EMA 21','Valid long trigger candle in the execution zone',
 'Execution candle within 16% proximity of VWAP / EMA','SQZMOM shows 2 consecutive improving transitions',
 'SQZMOM phase supports long','SQZMOM bias is bullish','Risk / reward ≥ 2.0'];
const HARD_SHORT=['Market bias is Bear','Market structure is LH / LL (Sideways = no trade)',
 'Price below VWAP','Price below EMA 21','Valid short trigger candle in the execution zone',
 'Execution candle within 16% proximity of VWAP / EMA','SQZMOM shows 2 consecutive weakening transitions',
 'SQZMOM phase supports short','SQZMOM bias is bearish','Risk / reward ≥ 2.0'];
const SOFT_LONG=['Price above EMA 9','VWAP acting as support','EMA 9 acting as support','EMA 21 acting as support',
 'Signal candle not far above trend','Signal candle on pullback zone','SQZMOM momentum increasing'];
const SOFT_SHORT=['Price below EMA 9','VWAP acting as resistance','EMA 9 acting as resistance','EMA 21 acting as resistance',
 'Signal candle not far below trend','Signal candle on pullback zone','SQZMOM momentum decreasing'];
const TRIGGERS_L=['hammer','reclaim','pullback_continuation'];
const TRIGGERS_S=['bearish_rejection','failed_reclaim','short_pullback_continuation'];

let SCAN_N=1;

/* Build one scan candidate for a ticker, then run it through the v1.0 rule set. */
function build(u,seed){
 const r=mkRnd(hash(u.tk)+seed*104729);const R=(a,b)=>a+r()*(b-a);
 const dir=MARKET_BIAS==='Bear'?'short':'long';
 const px=+(u.base*(1+(r()-.5)*.03)).toFixed(2);
 const atr=+R(.5,2.6).toFixed(2);
 const risk=px*atr/100*R(.5,.85);
 const entry=+(px*(1+(dir==='long'?.0012:-.0012))).toFixed(2);
 const rrRaw=+R(1.3,3.9).toFixed(2);
 const stop=+(dir==='long'?entry-risk:entry+risk).toFixed(2);
 const tp=+(dir==='long'?entry+risk*rrRaw:entry-risk*rrRaw).toFixed(2);
 const rr=Math.round(Math.abs((tp-entry)/(entry-stop))*100)/100;   /* rounded before compare — IEEE 754 fix */
 /* 5-slot SQZMOM execution zone, execution bar at index 3 */
 const base=dir==='long'?-7:7;const sqz=[];let v=base;
 const good=r()>.34;
 for(let i=0;i<5;i++){
   const step=dir==='long'?R(1.4,3.2):-R(1.4,3.2);
   if(!good&&i===2)v-=step*1.4; else v+=step;
   sqz.push(+v.toFixed(1));
 }
 const ex=3;
 const transOK=dir==='long'
   ?(sqz[ex]>sqz[ex-1]&&sqz[ex-1]>sqz[ex-2])
   :(sqz[ex]<sqz[ex-1]&&sqz[ex-1]<sqz[ex-2]);
 const o={tk:u.tk,name:u.name,dir,px,entry,stop,tp,rr,atr,sqz,ex,transOK,
  chg:+R(-3.2,4.4).toFixed(2),vol:R(1.4,62).toFixed(1)+'M',relVol:+R(.4,3.4).toFixed(1),
  rsi:Math.round(R(28,84)),distVWAP:+R(.02,1.9).toFixed(2),distEMA:+R(.05,2.1).toFixed(2),
  structure:r()>.24?(dir==='long'?'HH / HL':'LH / LL'):'Sideways',
  vsVWAP:r()>.2?(dir==='long'?'above':'below'):(dir==='long'?'below':'above'),
  vsEMA21:r()>.22?(dir==='long'?'above':'below'):(dir==='long'?'below':'above'),
  vsEMA9:r()>.35?(dir==='long'?'above':'below'):(dir==='long'?'below':'above'),
  trigger:r()>.2?(dir==='long'?TRIGGERS_L[Math.floor(r()*3)]:TRIGGERS_S[Math.floor(r()*3)]):'none',
  proximity:+R(2,26).toFixed(1),
  sqzPhase:r()>.24?(dir==='long'?'shifting_bearish_to_bullish':'shifting_bullish_to_bearish'):'neutral',
  sqzBias:r()>.2?(dir==='long'?'bullish':'bearish'):'neutral',
  squeeze:r()>.4?'squeeze_off':'squeeze_on',
  momentum:r()>.35?(dir==='long'?'increasing':'decreasing'):'flat',
  vwapRole:r()>.35?(dir==='long'?'support':'resistance'):'neutral',
  ema9Role:r()>.4?(dir==='long'?'support':'resistance'):'neutral',
  ema21Role:r()>.38?(dir==='long'?'support':'resistance'):'neutral',
  trendRel:r()>.3?'pullback':'far_from_trend'};
 return evaluate(o);
}
/* The v1.0 rule engine — hard filters gate, soft filters shape confidence. */
function evaluate(o){
 const L=o.dir==='long';
 const hard=[
  {t:L?'Market bias is Bull':'Market bias is Bear',ok:MARKET_BIAS===(L?'Bull':'Bear'),
   why:`Market bias is ${MARKET_BIAS}`},
  {t:L?'Market structure is HH / HL':'Market structure is LH / LL',ok:o.structure!=='Sideways',
   why:'Structure is Sideways'},
  {t:L?'Price above VWAP':'Price below VWAP',ok:o.vsVWAP===(L?'above':'below'),
   why:`Price ${o.vsVWAP} VWAP`},
  {t:L?'Price above EMA 21':'Price below EMA 21',ok:o.vsEMA21===(L?'above':'below'),
   why:`Price ${o.vsEMA21} EMA 21`},
  {t:'Valid trigger candle in execution zone',ok:o.trigger!=='none',
   why:'No valid trigger candle'},
  {t:'Execution candle within 16% proximity zone',ok:o.proximity<=16,
   why:`${o.proximity}% from VWAP / EMA — exceeds 16%`},
  {t:L?'SQZMOM 2 consecutive improving transitions':'SQZMOM 2 consecutive weakening transitions',
   ok:o.transOK,why:`SQZMOM sequence [${o.sqz.join(', ')}] breaks at the execution bar`},
  {t:L?'SQZMOM phase supports long':'SQZMOM phase supports short',
   ok:o.sqzPhase!=='neutral',why:'SQZMOM phase is neutral'},
  {t:L?'SQZMOM bias is bullish':'SQZMOM bias is bearish',
   ok:o.sqzBias!=='neutral',why:'SQZMOM bias is neutral'},
  {t:'Risk / reward ≥ 2.0',ok:o.rr>=2,why:`R:R ${o.rr.toFixed(2)} below 2.0`},
 ];
 const soft=[
  {t:L?'Price above EMA 9':'Price below EMA 9',ok:o.vsEMA9===(L?'above':'below')},
  {t:L?'VWAP acting as support':'VWAP acting as resistance',ok:o.vwapRole!=='neutral'},
  {t:L?'EMA 9 acting as support':'EMA 9 acting as resistance',ok:o.ema9Role!=='neutral'},
  {t:L?'EMA 21 acting as support':'EMA 21 acting as resistance',ok:o.ema21Role!=='neutral'},
  {t:L?'Signal candle not far above trend':'Signal candle not far below trend',ok:o.trendRel==='pullback'},
  {t:'Signal candle on pullback zone',ok:o.trendRel==='pullback'},
  {t:L?'SQZMOM momentum increasing':'SQZMOM momentum decreasing',ok:o.momentum!=='flat'},
 ];
 const fails=hard.filter(h=>!h.ok);
 const softPass=soft.filter(s=>s.ok).length;
 o.hard=hard;o.soft=soft;o.fails=fails;o.softPass=softPass;
 o.valid=fails.length===0;
 o.conf=o.valid?Math.round(70+(softPass/7)*30):0;   /* v1.0 confidence formula */
 o.decision=o.valid?(L?'VALID LONG':'VALID SHORT'):'NO TRADE';
 return o;
}

 });

RENDER.scan=()=>{
 const valid=RESULTS.filter(o=>o.valid);
 $('view').innerHTML=`

  const drift=(o.dir==='long'?.0006:-.0004)+(i>n*.65?(o.dir==='long'?.0009:-.0007):0);
  const op=p,c=Math.max(1,op*(1+drift+(r()-.49)*vol*1.5));
  out.push({o:op,c,h:Math.max(op,c)*(1+r()*.004),l:Math.min(op,c)*(1-r()*.004),
   v:Math.round(180000+Math.pow(r(),1.8)*1700000),t:new Date(t0.getTime()+i*D.tf*60000)});
  p=c}
 const sc=o.px/out[out.length-1].c;
 out.forEach(x=>{x.o*=sc;x.c*=sc;x.h*=sc;x.l*=sc});
 const cl=out.map(x=>x.c);

function pwMeter(v){
 let sc=0;if(v.length>=12)sc+=30;else sc+=v.length*2;
 if(/[a-z]/.test(v)&&/[A-Z]/.test(v))sc+=25;
 if(/\d/.test(v))sc+=20;if(/[^A-Za-z0-9]/.test(v))sc+=25;
 sc=Math.min(100,sc);const f=$('pwFill'),t=$('pwTxt');if(!f)return;
 f.style.width=sc+'%';f.style.background=sc<40?'var(--dn)':sc<70?'var(--amb)':'var(--up)';
 t.textContent=!v?'Minimum 12 characters with mixed case, numbers and symbols'
  :sc<40?'Weak — add length and character variety'
  :sc<70?'Moderate — add symbols or increase length':'Strong password'}

/* ═══ SMALL CHART HELPERS ═══ */
function sparkline(cv,data,color,w,h,grid){
 if(!cv)return;const d=window.devicePixelRatio||1;
 cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
 const mn=Math.min(...data),mx=Math.max(...data),rg=(mx-mn)||1;
 const X=i=>6+(i/(data.length-1))*(w-12),Y=v=>6+(1-(v-mn)/rg)*(h-12);
 if(grid){c.strokeStyle='#ffffff08';c.lineWidth=1;
  for(let i=0;i<=4;i++){const y=6+(i/4)*(h-12);c.beginPath();c.moveTo(6,y);c.lineTo(w-6,y);c.stroke()}}
 const g=c.createLinearGradient(0,6,0,h-6);
 g.addColorStop(0,color+'2e');g.addColorStop(1,color+'00');
 c.beginPath();c.moveTo(X(0),Y(data[0]));data.forEach((v,i)=>c.lineTo(X(i),Y(v)));
 c.lineTo(X(data.length-1),h-6);c.lineTo(X(0),h-6);c.closePath();c.fillStyle=g;c.fill();
 c.beginPath();c.moveTo(X(0),Y(data[0]));data.forEach((v,i)=>c.lineTo(X(i),Y(v)));
 c.strokeStyle=color;c.lineWidth=2;c.lineJoin='round';c.stroke()}
function barChart(cv,data,w,h){
 if(!cv)return;const d=window.devicePixelRatio||1;
 cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
 const mx=Math.max(...data)||1,gap=w/data.length,bw=gap*.62;
 data.forEach((v,i)=>{const bh=v/mx*(h-24),x=i*gap+(gap-bw)/2,y=h-bh-18;
  c.fillStyle=v>=60?'#00e08a':v>=50?'#fbbf24':'#ff4d5e';
  c.beginPath();c.roundRect(x,y,bw,bh,3);c.fill();
  c.fillStyle='#9a9aab';c.font='600 9.5px "JetBrains Mono",monospace';c.textAlign='center';
  c.fillText(v+'%',x+bw/2,y-5)})}
